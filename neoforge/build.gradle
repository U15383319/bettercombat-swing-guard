plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:" + rootProject.neoforge_version

    modImplementation "maven.modrinth:5sy6g3kz:" + rootProject.better_combat_neoforge_artifact
    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:" + rootProject.cloth_config_version
    modImplementation "dev.kosmx.player-anim:player-animation-lib-forge:" + rootProject.player_animator_version
    modLocalRuntime "maven.modrinth:tiny-config:" + rootProject.tiny_config_version + "-neoforge"

    common(project(path: ":common", configuration: "namedElements")) {
        transitive false
    }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) {
        transitive false
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "better_combat_version", rootProject.better_combat_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
                version: project.version,
                better_combat_version: rootProject.better_combat_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    dependsOn project(":common").sourcesJar
    from(project(":common").sourcesJar.archiveFile.map { zipTree(it) })
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
