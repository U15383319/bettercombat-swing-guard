plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:" + rootProject.fabric_loader_version
    modImplementation "net.fabricmc.fabric-api:fabric-api:" + rootProject.fabric_api_version

    modImplementation "maven.modrinth:5sy6g3kz:" + rootProject.better_combat_fabric_artifact
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:" + rootProject.cloth_config_version) {
        exclude group: "net.fabricmc.fabric-api"
    }
    modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:" + rootProject.player_animator_version
    // Loom strips Better Combat's embedded library from the development JAR.
    modLocalRuntime "maven.modrinth:tiny-config:" + rootProject.tiny_config_version + "-fabric"

    common(project(path: ":common", configuration: "namedElements")) {
        transitive false
    }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) {
        transitive false
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "better_combat_version", rootProject.better_combat_version

    filesMatching("fabric.mod.json") {
        expand(
                version: project.version,
                better_combat_version: rootProject.better_combat_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    dependsOn project(":common").sourcesJar
    from(project(":common").sourcesJar.archiveFile.map { zipTree(it) })
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        bettercombat_swing_guard {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
        swingguard_gametest {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gameTest {
            server()
            source sourceSets.gametest
            runDir "build/gametest"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.file('build/gametest/results.xml').absolutePath}"
        }
    }
}
