plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:" + rootProject.fabric_loader_version
    modImplementation "net.fabricmc.fabric-api:fabric-api:" + rootProject.fabric_api_version

    modImplementation "maven.modrinth:5sy6g3kz:" + rootProject.better_combat_fabric_artifact
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:" + rootProject.cloth_config_version) {
        exclude group: "net.fabricmc.fabric-api"
    }
    modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:" + rootProject.player_animator_version
    modLocalRuntime "io.github.llamalad7:mixinextras-fabric:" + rootProject.mixin_extras_version

    common(project(path: ":common", configuration: "namedElements")) {
        transitive false
    }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) {
        transitive false
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "better_combat_version", rootProject.better_combat_version

    filesMatching("fabric.mod.json") {
        expand(
                version: project.version,
                better_combat_version: rootProject.better_combat_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    dependsOn project(":common").sourcesJar
    from(project(":common").sourcesJar.archiveFile.map { zipTree(it) })
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
