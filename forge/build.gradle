plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

loom {
    forge {
        mixinConfig "bettercombat_swing_guard.mixins.json"
        mixinConfig "bettercombat_swing_guard-forge.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:" + rootProject.minecraft_version + "-" + rootProject.forge_version

    modImplementation "maven.modrinth:5sy6g3kz:" + rootProject.better_combat_forge_artifact
    modImplementation "me.shedaniel.cloth:cloth-config-forge:" + rootProject.cloth_config_version
    modImplementation "dev.kosmx.player-anim:player-animation-lib-forge:" + rootProject.player_animator_version
    modLocalRuntime "io.github.llamalad7:mixinextras-forge:" + rootProject.mixin_extras_version

    common(project(path: ":common", configuration: "namedElements")) {
        transitive false
    }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) {
        transitive false
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "better_combat_version", rootProject.better_combat_version

    filesMatching("META-INF/mods.toml") {
        expand(
                version: project.version,
                better_combat_version: rootProject.better_combat_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    dependsOn project(":common").sourcesJar
    from(project(":common").sourcesJar.archiveFile.map { zipTree(it) })
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
