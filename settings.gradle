pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

if (JavaVersion.current() < JavaVersion.VERSION_21) {
    throw new IllegalStateException("Java 21 or newer is required")
}

include("common")
include("fabric")
include("neoforge")

rootProject.name = "bettercombat-swing-guard"

